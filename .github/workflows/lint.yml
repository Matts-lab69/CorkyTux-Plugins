name: lint

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install linters
        run: |
          python -m pip install --upgrade pip ruff
          sudo apt-get update
          sudo apt-get install -y shellcheck
      - name: Ruff
        run: ruff check .
      - name: ShellCheck
        run: shellcheck heroic-store/install.sh
      - name: Manifest JSON
        run: |
          for f in */plugin.json; do
            python -m json.tool "$f" >/dev/null
          done
