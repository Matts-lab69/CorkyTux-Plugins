[tool.ruff]
target-version = "py310"
line-length = 100
# The plugin entrypoints have no .py extension, so ruff skips them by
# default. I list every one of them explicitly to lint them too.
extend-include = [
  "appimage-launcher/appimage-launcher",
  "dependency-installer/dependency-installer",
  "dll-overrides-automator/dll-overrides-automator",
  "emulator-manager/emulator-manager",
  "heroic-store/heroic-store",
  "minecraft-launcher/minecraft-launcher",
  "rpgmaker-runtime/rpgmaker-runtime",
]
exclude = [
  "rpgmaker-runtime/vendor",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
